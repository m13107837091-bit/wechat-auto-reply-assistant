# ============================================================
# 微信自动回复助手 - 行为策略配置
# 密钥（api key 等）请在 .env 里填，本文件只放非敏感的行为配置。
# ============================================================

llm:
  provider: openai          # openai | ollama
  model: deepseek-chat      # 可被 .env 的 LLM_MODEL 覆盖
  temperature: 0.6
  max_tokens: 300           # 调低：短回复生成更快、更及时
  timeout_seconds: 30
  system_prompt: >-
    你是「三哥的三弟」，是主人开发的自动回复智能体。你的主人是正在准备考研的"三哥"，
    学习时不方便及时回复消息，所以由你替他看消息、回复别人。

    你要这样做：
    - 首次回复时自然地介绍自己：你是三哥开发的智能体，三哥正在考研、暂时在忙，
      有什么事可以先跟你说，你会尽快转达；对方想聊几句，你也可以陪聊。
    - 之后就像真人一样自然聊天，别反复强调"我是智能体/机器人"，点到为止，别让对话生硬。
    - 语气友善、真诚、有分寸；回复务必简短，一般一两句话即可，不要长篇大论、不要罗列多条、不要反问一堆问题；不确定的事不要编造，直接说不知道。

reply:
  # 只回复这些对象（联系人备注名或群名）；留空 [] 表示不限制
  whitelist: []
  # 永不回复这些对象
  blacklist: []
  # 名单匹配方式：exact（精确匹配全名）| contains（包含即可命中，备注名带后缀/改名也不失效）
  match_mode: exact
  # 仅当消息包含其中任一关键词才回复；留空 [] 表示所有消息都回复
  keyword_trigger: []
  # 限速（防打扰 / 降低封号风险）
  max_reply_per_minute: 20
  min_interval_seconds: 1.0
  # 夜间静默时段（在此区间内不自动回复）
  night_silence:
    enabled: true
    start: "23:30"
    end: "07:00"
  # 大模型出错时的兜底回复；置空 "" 表示出错时直接不回复
  fallback_reply: "（自动回复）我现在不方便回复，稍后联系。"
  # 群聊
  group:
    enabled: false              # 默认不回复任何群聊（只回私聊）；需要回群再改回 true
    only_when_mentioned: true   # 仅当被 @ 时回复，避免群聊刷屏
    self_nickname: ""           # 你在微信里的昵称，用于精确判断“是否@了我”；留空则退化为“群里有人被@就回复”
  # 私聊
  friend:
    enabled: true

session:
  max_turns: 8        # 每个会话保留最近 N 轮上下文
  ttl_seconds: 3600   # 会话 N 秒无交互后清空记忆

# ============================================================
# 人设（影响回复的语气与风格，让回复更自然、更多样）
# ============================================================
persona:
  name: "三哥的三弟"          # 机器人自称（主人是三哥）
  style: "自然真诚、靠谱"      # 替备考的主人代回消息，语气自然不端着
  emoji: true               # 是否适度使用 emoji
  length: short             # short（尽量简短，回复更及时）/ auto / detailed

# ============================================================
# 联网搜索（可选增强：天气 / 新闻 / 股价等实时问题）
# 仅在 .env 里配置了 SEARCH_API_KEY 时才真正启用；留空则忽略，程序照常直接回复。
# ============================================================
search:
  enabled: true
  provider: tavily           # 目前支持 tavily
  top_k: 4                   # 每次取前几条结果作为参考资料
  timeout_seconds: 10
  # 命中这些关键词才触发搜索（保持“适当”，避免每条消息都搜）
  keywords:
    - 天气
    - 气温
    - 下雨
    - 新闻
    - 头条
    - 热搜
    - 实时
    - 最新
    - 股价
    - 股票
    - 汇率
    - 油价
    - 金价
    - 比分
    - 排名